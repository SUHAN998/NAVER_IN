<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="03upload.css">
    <title>지식iN QnA 상세</title>
</head>

<body>
    <div class="container">
    <header class="header">
    <div class="header-inner">
        <h1 class="logo">
            <a class="go-main" href="01main.html">
            <img src="img/00지식인 로고.png" width="100" height="auto" alt="NAVER 지식iN">
            </a>
        </h1>

        <nav class="gnb">
        <home href="#">홈</home>
        <qna href="#">Q&A</qna>
        <best href="#">베스트</best>
        <HOF href="#">명예의 전당</HOF>
        </nav>
        <div class="header-right"> <!-- 상단 바 오른쪽 (검색,알림,마이,질문) -->
        <input type="text" placeholder="검색어를 입력해주세요" class="search-bar">
        
        <div class="alarm">
            <img class="bell" src="img/04알림3.png" width="35px" height="43px" alt="alarm">
        </div>
        
        <div class="user-profile">
            <img class="user" src="img/20_사용자프사.png" width="48" height="48" radius="50%" alt="user">
        </div>
        <!-- <button class="btn-ask">질문하기</button> -->
        </div>
    </div>
    </header>

    <div class="content-wrapper">
    <aside class="side-left">
    </aside>


    <!-- 중앙 메인 콘텐츠 -->

    <main class="main-content">
        <div class="container_m">

            <h1 class="main-title"><span class="q-mark">Q.</span>질문</h1>



            <!-- 카드 (질문작성) -->
    <article class="question-card">
        
        <header class="card-top">
            <div class="top1">
                <div class="top1-L">
                    <h2>제목</h2>
                </div>
                <div class="top1-R">
                    <p>0 / 50</p>
                </div>
            </div>

            <!-- 질문 제목 입력 -->
            <div class="input-title">
                <input type="text" placeholder="질문 제목을 입력해주세요" class="title">
                <!-- <div class="input-divider"></div> -->

            </div>
        </header>

        <section class="card-mid">
            

            <!-- 질문 내용 입력 -->
            <div class="top1">
                <div class="top1-L">
                    <h2>내용</h2>
                </div>
                <div class="top1-R">
                    <p>0 / 5,000</p>
                </div>
            </div>
            <div class="content-wrap">
                <div class="content-top">
                    <img class="image" height="32px" width="auto" src="img/10_이미지1.png" alt="image">
                    <img class="image" height="32px" width="auto" src="img/11_글머리기호1.png" alt="bullet">
                    <img class="image" height="32px" width="auto" src="img/12_텍스트굵게1.png" alt="bold">
                    <img class="image" height="32px" width="auto" src="img/13_파일첨부1.png" alt="file">
                </div>
                <div class="textarea-content">
                <textarea type="text" placeholder="질문 내용을 입력해주세요" class="content"></textarea>
                <!-- <div class="input-divider"></div> -->

            </div>
            </div>
            

        </section>

        <input type="checkbox" id="comment-toggle">


        <footer class="card-bottom">
            
            
            <div class="bottom-center">
                <span class="tag">#부동산</span>
                <span class="tag">#건축</span>
                <span class="tag">#보증금</span>
                <span class="tag">#대출</span>
            </div>
            
        </footer>
        <div class="divider"></div>

        <div class="bottom1">
            <div class="bottom1-L">
                <p>질문분야)</p>
                <div class="select-box">
                    <label for="category">질문분야</label>
                    <select id="category" name="category">
                        <option value="">관련 분야 선택</option>
                        <option value="estate">전문지식 / 학문</option>
                        <option value="estate">IT / 테크</option>
                        <option value="estate">라이프 / 건강</option>
                        <option value="estate">컬처 / 취미</option>
                        <option value="estate">고민 / 커뮤니티</option>
                        
                    </select>
                </div>
            </div>
            <div class="bottom1-R">
                <span class="label-text">태그</span>
            <div class="tag-input-box">
                <input type="text" id="tag-input" placeholder="태그를 입력해주세요">
                <button type="button" id="add-tag-btn">추가</button>
            </div>
        </div>
        <!-- <div id="tag-container" class="tag-container">
        </div>
        

        <div class="expandable-content"> -->
        
    </div>

    <!-- 펼치기 -->
    <div class="expand-section">
    <input type="checkbox" id="expand-trigger">
    <label for="expand-trigger" class="expand-btn">추가설정 <span class="arrow">▼</span></label>
    

    <div class="expand-target">
    <div class="setting-row line-top">
        <div class="setting-label">1:1 질문</div>
        <div class="setting-content">
            <select class="expert-select">
                <option>답변자 선택하기</option>
            </select>
            <span class="info-text">답변자가 반려하기 전까지는 1:1 질문이 유지됩니다.</span>
        </div>
    </div>

    <div class="setting-row line-top">
        <div class="setting-label">공개설정</div>
        <div class="setting-content toggle-group">
            <div class="toggle-item">
                <span>질문자 별명</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
                <span class="status-text">공개</span>
            </div>
            <div class="toggle-item">
                <span>미성년자 열람</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
                <span class="status-text">허용</span>
            </div>
            <div class="toggle-item">
                <span>외부검색</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
                <span class="status-text">허용</span>
            </div>
            <div class="toggle-item">
                <span>만 14세 미만<br>답변 참여</span>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
                <span class="status-text">비허용</span>
            </div>
            <div class="toggle-item reservation">
    <span>업로드 예약</span>
    
    <div class="reservation-controls">
        <div class="switch-box">
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
            <span class="status-text">설정</span>
        </div>

        <div class="time-picker-container">
            <input type="text" class="time-input" value="03:30 PM">
            <button class="btn-more">···</button>
        </div>
    </div>
</div>
        </div>
    </div>
</div>
    
</div>
    </article>



    </main>

    <!-- 중앙 메인 콘텐츠 끝 -->



    <!-- 오른쪽 사이드바 -->
    <aside class="side-right">
    
    <div class="sticky-side-box">
        <div class="ad-banner">
            <img src="img/36_지식인_광고.png" width="240px">
        </div>
        <button class="btn-main-submit">질문 등록</button>

        <div class="btn-under">
            <div class="underL">
                <button class="btn-save1">임시저장</button>
            </div>
            <div class="underR">
                <button class="btn-cancel">작성취소</button>
            </div>
        </div>

        <!-- 푸터 -->
    <div class="footer">
        <div class="footer-inner">
        <div class="footer-1">
            <span>이용약관</span>
            <span>지식iN 서비스 운영정책</span>
        </div>
        <div class="footer-2">
            <span>개인정보처리방침</span>
            <span>권리보호센터</span>
        </div>
        <div class="footer-3">
            <span>지식iN 고객센터</span>
            <span><span>&copy; NAVER Corp.</span></span>
        </div>
        </div>
    </div>
    </div>
        
    </aside>
    </div>
</div>
<script src="03upload.js"></script>
</body>
</html>
